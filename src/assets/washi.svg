<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260">
  <!-- 和紙紋理：細顆粒 + 橫向長纖維 -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 0 0.17  0.26 0 0 0 -0.08" />
  </filter>
  <filter id="fiber" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.12" numOctaves="3" seed="11" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.52  0 0 0 0 0.42  0 0 0 0 0.27  0.5 0 0 0 -0.25" />
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" />
  <rect width="100%" height="100%" filter="url(#fiber)" />
</svg>
